<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgV Survey — HMTS Lab, McGill University</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1d1d1f; background: #f5f5f7;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
  }
  /* centring lives on this page's own text only: the chat widget inherits from
     body, and a centred body turns every survey question into centred text */
  .page { text-align: center; max-width: 34rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; }
  p  { margin: 0 0 4px; color: #4a4a4f; }
  .small { font-size: .85rem; color: #6e6e73; margin-top: 16px; }
</style>
</head>
<body>

<div class="page">
  <h1>AgV Survey</h1>
  <p>Human-Machine Transportation Systems Lab, McGill University</p>
  <p>The survey opens in the chat window. If it does not appear, use the button in the corner.</p>
  <p class="small" id="who"></p>
</div>

<script type="text/javascript">
// The participant's own code decides the session id, so the answers can be read
// back afterwards under that code. Prolific appends it to the link; the fallback
// keeps the page usable for a pilot or a link opened without one.
(function () {
  var q = new URLSearchParams(window.location.search);
  var pid = q.get('PROLIFIC_PID') || q.get('prolific_pid') || q.get('pid') || '';

  if (!pid) {
    pid = 'anon-' + Date.now().toString(36) + Math.floor(Math.random() * 1000);
  }
  window.__SESSION_ID__ = pid;
  document.getElementById('who').textContent = 'Session ' + pid;

  (function (d, t) {
    var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
    v.onload = function () {
      window.voiceflow.chat.load({
        verify: { projectID: '6aa7349f130c224030db4c18' },
        url: 'https://general-runtime.voiceflow.com',
        userID: window.__SESSION_ID__,
        launch: {
          event: {
            type: 'launch',
            payload: {
              prolific_pid: q.get('PROLIFIC_PID') || '',
              study_id: q.get('STUDY_ID') || '',
              session_id: q.get('SESSION_ID') || ''
            }
          }
        },
        assistant: {
          title: 'AgV Survey',
          description: 'McGill University · HMTS Lab',
          persistence: 'localStorage',
          // Table and list styling inside the chat window (rules from the 2026-10-13 display test):
          // shaded 40% row-label column, darker borders, 15px table text, hollow sub-bullets, plain rules.
          stylesheet: 'data:text/css;base64,LnZmcmMtbWVzc2FnZSAubWFya2Rvd24gdGFibGUgeyBmb250LXNpemU6IDE1cHg7IH0KLnZmcmMtbWVzc2FnZSAubWFya2Rvd24gdGgsIC52ZnJjLW1lc3NhZ2UgLm1hcmtkb3duIHRkIHsgYm9yZGVyLWNvbG9yOiByZ2JhKDI2LCAzMCwgMzUsIDAuMzUpOyB9Ci52ZnJjLW1lc3NhZ2UgLm1hcmtkb3duIHRyID4gOmZpcnN0LWNoaWxkIHsgYmFja2dyb3VuZC1jb2xvcjogI2UyZTVlODsgd2lkdGg6IDQwJTsgfQoudmZyYy1tZXNzYWdlIC5tYXJrZG93biB1bCB1bCB7IG1hcmdpbi10b3A6IDRweDsgcGFkZGluZy1sZWZ0OiAxOHB4OyB9Ci52ZnJjLW1lc3NhZ2UgLm1hcmtkb3duIHVsIHVsID4gbGkgeyBtYXJnaW4tdG9wOiAycHg7IG1hcmdpbi1ib3R0b206IDJweDsgfQoudmZyYy1tZXNzYWdlIC5tYXJrZG93biB1bCB1bCA+IGxpOjpiZWZvcmUgeyBiYWNrZ3JvdW5kLWNvbG9yOiB0cmFuc3BhcmVudDsgYm9yZGVyOiAxcHggc29saWQgY3VycmVudENvbG9yOyB3aWR0aDogM3B4OyBoZWlnaHQ6IDNweDsgfQoudmZyYy1tZXNzYWdlIC5tYXJrZG93biBociB7IGJvcmRlcjogMDsgYm9yZGVyLXRvcDogMXB4IHNvbGlkIHJnYmEoMjYsIDMwLCAzNSwgMC4zKTsgaGVpZ2h0OiAwOyBtYXJnaW46IDEycHggMDsgfQ=='
        },
        render: { mode: 'overlay' },
        autostart: true
      });
    };
    v.src = 'https://cdn.voiceflow.com/widget-next/bundle.mjs';
    v.type = 'text/javascript';
    s.parentNode.insertBefore(v, s);
  })(document, 'script');
})();
</script>
