<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgV Survey — HMTS Lab, McGill University</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1d1d1f; background: #f5f5f7;
    display: flex; flex-direction: column;
  }
  /* one slim line above the chat: who runs the survey, and the session code for support requests */
  .top {
    flex: 0 0 auto; width: 100%; max-width: 720px; margin: 0 auto; box-sizing: border-box;
    padding: 6px 16px; display: flex; justify-content: space-between; gap: 12px;
    font-size: .8rem; color: #6e6e73;
  }
  /* the survey chat fills the rest of the screen: a centred column on a computer, the full width on a phone */
  #vf {
    flex: 1 1 auto; min-height: 0; width: 100%; max-width: 720px; margin: 0 auto;
    background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06);
  }
</style>
</head>
<body>

<div class="top">
  <span>Human-Machine Transportation Systems Lab, McGill University</span>
  <span id="who"></span>
</div>
<div id="vf"></div>

<script type="text/javascript">
// The participant's own code decides the session id, so the answers can be read
// back afterwards under that code. Prolific appends it to the link. A link opened
// without one gets an id kept in this browser: a reload resumes the same session,
// and each tester on another browser gets an id of their own.
(function () {
  var q = new URLSearchParams(window.location.search);
  var pid = q.get('PROLIFIC_PID') || q.get('prolific_pid') || q.get('pid') || '';
  pid = pid.trim().replace(/[^A-Za-z0-9_-]/g, '');
  if (!pid) {
    try { pid = window.localStorage.getItem('agv_anon_id') || ''; } catch (e) {}
    if (!pid) {
      pid = 'anon-' + Date.now().toString(36) + Math.floor(Math.random() * 1000);
      try { window.localStorage.setItem('agv_anon_id', pid); } catch (e) {}
    }
  }
  window.__SESSION_ID__ = pid;
  document.getElementById('who').textContent = 'Session ' + pid;

  (function (d, t) {
    var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
    v.onload = function () {
      window.voiceflow.chat.load({
        verify: { projectID: '6aa7349f130c224030db4c18' },
        url: 'https://general-runtime.voiceflow.com',
        userID: window.__SESSION_ID__,
        launch: {
          event: {
            type: 'launch',
            payload: {
              prolific_pid: q.get('PROLIFIC_PID') || '',
              study_id: q.get('STUDY_ID') || '',
              session_id: q.get('SESSION_ID') || ''
            }
          }
        },
        assistant: {
          persistence: 'localStorage',
          // Table and list styling inside the chat window (rules from the 2026-10-13 display test):
          // shaded 40% row-label column, darker borders, 15px table text, hollow sub-bullets, plain rules.
          // The last two rules hide the header restart control and the end-of-chat "Start new chat"
          // button: no widget setting removes them (checked 2026-10-15, widget-next 2.207.0).
          stylesheet: 'data:text/css;base64,LnZmcmMtbWVzc2FnZSAubWFya2Rvd24gdGFibGUgeyBmb250LXNpemU6IDE1cHg7IH0KLnZmcmMtbWVzc2FnZSAubWFya2Rvd24gdGgsIC52ZnJjLW1lc3NhZ2UgLm1hcmtkb3duIHRkIHsgYm9yZGVyLWNvbG9yOiByZ2JhKDI2LCAzMCwgMzUsIDAuMzUpOyB9Ci52ZnJjLW1lc3NhZ2UgLm1hcmtkb3duIHRyID4gOmZpcnN0LWNoaWxkIHsgYmFja2dyb3VuZC1jb2xvcjogI2UyZTVlODsgd2lkdGg6IDQwJTsgfQoudmZyYy1tZXNzYWdlIC5tYXJrZG93biB1bCB1bCB7IG1hcmdpbi10b3A6IDRweDsgcGFkZGluZy1sZWZ0OiAxOHB4OyB9Ci52ZnJjLW1lc3NhZ2UgLm1hcmtkb3duIHVsIHVsID4gbGkgeyBtYXJnaW4tdG9wOiAycHg7IG1hcmdpbi1ib3R0b206IDJweDsgfQoudmZyYy1tZXNzYWdlIC5tYXJrZG93biB1bCB1bCA+IGxpOjpiZWZvcmUgeyBiYWNrZ3JvdW5kLWNvbG9yOiB0cmFuc3BhcmVudDsgYm9yZGVyOiAxcHggc29saWQgY3VycmVudENvbG9yOyB3aWR0aDogM3B4OyBoZWlnaHQ6IDNweDsgfQoudmZyYy1tZXNzYWdlIC5tYXJrZG93biBociB7IGJvcmRlcjogMDsgYm9yZGVyLXRvcDogMXB4IHNvbGlkIHJnYmEoMjYsIDMwLCAzNSwgMC4zKTsgaGVpZ2h0OiAwOyBtYXJnaW46IDEycHggMDsgfQoudmZyYy1oZWFkZXItLWFjdGlvbnMsIC52ZnJjLWhlYWRlciAudmZyYy1idXR0b24sICNyZXN0YXJ0LWNoYXQsIC52ZnJjLXByb21wdCB7IGRpc3BsYXk6IG5vbmUgIWltcG9ydGFudDsgfQoudmZyYy1mb290ZXJfX3N0YXJ0LWJ1dHRvbiwgI3ZmcmMtc3RhcnQtY2hhdCB7IGRpc3BsYXk6IG5vbmUgIWltcG9ydGFudDsgfQ=='
        },
        // the chat is drawn inside #vf instead of a floating corner window
        render: { mode: 'embedded', target: d.getElementById('vf') },
        autostart: true
      });
    };
    v.src = 'https://cdn.voiceflow.com/widget-next/bundle.mjs';
    v.type = 'text/javascript';
    s.parentNode.insertBefore(v, s);
  })(document, 'script');
})();
</script>

</body>
</html>
